:root{
  --earth:#3A2416; --apricot:#F1D3A2; --pumpkin:#D8792E; --grass:#6E9F3A; --slime:#5EC8E5;
  --cream:#FBF3E4; --pumpkin-d:#A9531A;
  --px:'Press Start 2P', monospace; --txt:'Nunito', system-ui, sans-serif;
  --cs:40px; --w:8;
}
body[data-theme="morning"]{
  --text:#3A2416; --muted:#7A5C44;
  --g:#6E9F3A; --g2:#679836; --g-hi:#9CC46A; --g-lo:#557F2A;
  --paper:#F1D3A2; --paper-lo:#DDB985; --panel:#FBF3E4; --frame:#3A2416; --bg:#F6ECD8;
}
body[data-theme="sunset"]{
  --text:#FFF3E0; --muted:#FFDDBE;
  --g:#5F8C34; --g2:#59842F; --g-hi:#8DB25A; --g-lo:#46692A;
  --paper:#F0C795; --paper-lo:#D9A56E; --panel:#FFEBD2; --frame:#3A2416; --bg:#D46A6A;
}
body[data-theme="night"]{
  --text:#F1D3A2; --muted:#B9A98E;
  --g:#2F5A35; --g2:#2B5431; --g-hi:#4A7D4C; --g-lo:#1D3B22;
  --paper:#CDB58E; --paper-lo:#A99170; --panel:#262B4E; --frame:#0A0D20; --bg:#10163A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--txt);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#scene{position:fixed;left:0;top:0;z-index:0;image-rendering:crisp-edges;image-rendering:pixelated}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.screen{position:fixed;inset:0;display:none;flex-direction:column;z-index:2;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px)}
.screen.active{display:flex}
button{font:inherit;color:inherit;cursor:pointer}
.pix{image-rendering:crisp-edges;image-rendering:pixelated}

/* ---------- pixel buttons ---------- */
.btn{
  font-family:var(--px); font-size:13px; line-height:1.3;
  background:var(--pumpkin); color:var(--cream);
  border:3px solid var(--earth); border-radius:0;
  padding:14px 18px; box-shadow:0 5px 0 var(--earth), inset 0 3px 0 rgba(255,255,255,.22);
  transition:transform .06s, box-shadow .06s;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--earth)}
.btn.alt{background:var(--apricot);color:var(--earth)}
.btn.green{background:var(--grass)}
.btn.small{font-size:10px;padding:9px 11px;box-shadow:0 4px 0 var(--earth), inset 0 2px 0 rgba(255,255,255,.3)}
.btn.small:active{transform:translateY(3px);box-shadow:0 1px 0 var(--earth)}
.iconbtn{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:14px}

/* ---------- menu ---------- */
#menu{align-items:center;overflow-y:auto}
.menu-top{width:100%;max-width:460px;display:flex;justify-content:space-between;align-items:center}
.hero{display:flex;flex-direction:column;align-items:center;margin-top:4px}
.logo{
  width:112px;height:112px;position:relative;
  background:var(--apricot) var(--spr-slime) center 78%/74% no-repeat;
  border:7px solid var(--earth);
  box-shadow:inset -7px -7px 0 #D9B57E, inset 7px 7px 0 #F8E4C0, 0 7px 0 rgba(58,36,22,.3);
  image-rendering:crisp-edges;image-rendering:pixelated;
  animation:breathe 2.6s ease-in-out infinite;
}
.zz{position:absolute;font-family:var(--px);color:var(--pumpkin);font-size:15px;right:14px;top:10px;animation:zfloat 2.6s ease-in-out infinite}
.zz.b{font-size:10px;right:6px;top:2px;animation-delay:1.3s;opacity:.8}
.title{font-family:var(--px);text-align:center;margin:18px 0 4px;line-height:1.25;font-weight:400}
.title .a{display:block;font-size:30px;color:var(--earth);text-shadow:0 3px 0 rgba(255,255,255,.6)}
.title .b{display:block;font-size:30px;color:var(--pumpkin);margin-top:8px;text-shadow:0 3px 0 rgba(58,36,22,.25)}
.tagline{margin:12px 0 2px;font-weight:800;color:var(--muted);text-align:center;font-size:15px;line-height:1.45;max-width:340px}
.tagline b{color:var(--earth);font-weight:900}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 4px}
.chip{background:var(--apricot);color:var(--earth);font-weight:800;font-size:12px;padding:4px 9px;box-shadow:0 2px 0 #D9B57E}
.levels{width:100%;max-width:460px;display:flex;flex-direction:column;gap:12px;margin:16px 0 12px}
.lvl{
  display:flex;align-items:center;gap:12px;text-align:left;padding:12px;
  border:3px solid var(--earth);box-shadow:0 5px 0 var(--earth);background:var(--cream);
  transition:transform .06s, box-shadow .06s;
}

  if (lifeReady) { lifeReady = false; saved = true; } else hearts--;
  fieldErrs++;
  const hs = $('#hearts').children; if (!saved && hs[hearts]) { hs[hearts].classList.remove('pop'); void hs[hearts].offsetWidth; hs[hearts].classList.add('pop'); }
  rinBase = hearts <= 1 ? 'oops' : 'calm';
  setRin('shock', 2600);
  save.mistakes++;
  const pg = {k:'m', i: save.mistakes - 1, d: save.day, lv: L.id};
  save.pages.push(pg);
  const ai = ABIL.findIndex(a => a.need === save.mistakes);
  let apg = null;
  if (ai >= 0) { apg = {k:'a', i: ai, d: save.day}; save.pages.push(apg); if (ai === 2) lifeReady = true; }
  persist(); updateHud(); updateAbil();
  await wait(1150);
  sfx.page();
  await modal(`<div class="mhead">${saved ? 'Вторая жизнь спасла сердце!' : 'Новая страница в дневнике'}</div>` + pageHTML(pg, `стр. ${save.mistakes}`),
    [{text:'Записал', v:1}]);
  if (apg) {
    sfx.light(); haptic('ok'); setRin('happy', 2000);
    await modal(`<div class="mhead">Открыта способность: ${ABIL[ai].name}</div>` + pageHTML(apg), [{text:'Круто!', v:1, cls:'green'}]);
    updateHud();
  }
  over = false;
  if (hearts <= 0) lose(); else checkWin();
}
function revealAll(win) {
  cells.forEach((c, i) => {
    if (c.s && !c.o) { if (!c.f) { c.sl = true; c.hop = win; } els[i].style.setProperty('--zd', (Math.random() * 2).toFixed(2) + 's'); draw(i); }
    else if (!win && c.f && !c.s) { c.wrong = true; draw(i); }
  });
}
function checkWin() {
  if (over) return;
  const opened = cells.reduce((a, c) => a + (c.o && !c.s ? 1 : 0), 0);
  if (opened === W * H - N) win();
}
async function win() {
  over = true;
  const time = Date.now() - fieldT0;
  cells.forEach(c => { if (c.s && !c.o) c.f = false; });
  revealAll(true); updateHud();
  sfx.win(); haptic('ok'); rinBase = 'happy'; setRin('happy');
  const cols = ['#D8792E', '#E9A23B', '#6E9F3A', '#5EC8E5', '#F1D3A2', '#FFE27A'];
  [.25, .5, .75].forEach((fxx, k) => setTimeout(() => burst(innerWidth * fxx, innerHeight * .35, 40, cols, 7, .2), k * 220));
  save.done[L.id] = true; save.unlocked = Math.max(save.unlocked, Math.min(3, L.id + 2));
  const prev = save.best[L.id], rec = !prev || time < prev;
  if (rec) save.best[L.id] = time;
  const wp = {k:'w', i: L.id, d: save.day}; save.pages.push(wp);
  const last = L.id === 2;
  if (last) save.finished = true;
  persist();
  await wait(1300);
  const stats = `<div class="stats"><div><b>${fmtTime(time)}</b>время</div><div><b>${fieldErrs}</b>${plural(fieldErrs, 'ошибка', 'ошибки', 'ошибок')}</div>
    <div class="${rec ? 'rec' : ''}"><b>${fmtTime(save.best[L.id])}</b>${rec ? 'новый рекорд!' : 'рекорд'}</div></div>`;
  const shareText = `Я очистил «${L.name}» в «Дневнике сапёра» за ${fmtTime(time)}${fieldErrs ? `, разбудил ${fieldErrs} ${plural(fieldErrs, 'слайма', 'слаймов', 'слаймов')} и написал о каждом страницу в дневнике` : ' и не разбудил ни одного слайма'} 🍂 А ты сможешь?`;
  const v = await modal(`<div class="mhead">Поле чистое!</div>` + pageHTML(wp) + stats + `<button class="btn small alt sharebtn" id="shareBtn">Поделиться с друзьями</button>`,
    last ? [{text:'Читать дневник', v:'diary', cls:'green'}] :
           [{text:'Меню', v:'menu', cls:'alt'}, {text:'Дальше', v:'next', cls:'green'}],
    box => { box.querySelector('#shareBtn').onclick = () => share(shareText); });
  if (v === 'next') startLevel(L.id + 1);
  else if (v === 'diary') openDiary('menu');
  else openMenu();
}
async function lose() {
  over = true; revealAll(false); sfx.lose(); haptic('err');
  rinBase = 'sad'; setRin('sad');
  await wait(1000);
  const v = await modal(`<div class="mhead">Сердца кончились</div><div class="mtext"><img class="face" src="${FACE.sad}" alt="">
    Рин ушёл пить чай.<br>Завтра новое поле — дневник и способности остаются.
    <br><br><b>Страниц в дневнике: ${save.mistakes}</b></div>`,
    [{text:'Меню', v:'menu', cls:'alt'}, {text:'Новое поле', v:'again', cls:'green'}]);
  if (v === 'again') startLevel(L.id); else openMenu();
}

/* --- способности --- */
$('#abLight').onclick = () => {
  if (over || modalOpen) return;
  if (save.mistakes < 3) { toast('Свет откроется на 3-й странице дневника'); return; }
  if (cd.light > Date.now()) { toast('Свет ещё перезаряжается'); return; }
  if (!started) { toast('Сначала сделай первый шаг — он всегда безопасный'); return; }
  const safe = cells.map((c, i) => i).filter(i => !cells[i].o && !cells[i].s && !cells[i].f && !cells[i].lit);
  if (!safe.length) { toast('Безопасных клеток не осталось'); return; }
  const front = safe.filter(i => nb(i).some(j => cells[j].o && !cells[j].b));
  const pool = front.length ? front : safe;
  const pick = pool[Math.random() * pool.length | 0];
  cells[pick].lit = true; draw(pick);
  els[pick].scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});
  const r = els[pick].getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2, 14, ['#FFE27A', '#FFF3C4', '#F3B63F'], 3, .05);
  cd.light = Date.now() + ABIL[0].cd * 1000;
  sfx.light(); haptic('ok'); setRin('happy', 1500); toast('Свет: эта клетка безопасна'); updateAbil();
};
$('#abSense').onclick = () => {
  if (over || modalOpen) return;
  if (save.mistakes < 6) { toast('Чутьё откроется на 6-й странице дневника'); return; }
  if (cd.sense > Date.now()) { toast('Чутьё ещё перезаряжается'); return; }
  if (!started) { toast('Сначала сделай первый шаг'); return; }
  sensing = !sensing; document.body.classList.toggle('sensing', sensing); updateAbil();
  toast(sensing ? 'Нажми на любую клетку — Чутьё посчитает слаймов в её строке' : 'Чутьё отменено');
};
$('#abLife').onclick = () => {
  if (save.mistakes < 9) toast('Вторая жизнь откроется на 9-й странице');
  else toast(lifeReady ? 'Первый слайм на этом поле не отнимет сердце' : 'Вторая жизнь на этом поле уже потрачена');
};
function useSense(i) {
  sensing = false; document.body.classList.remove('sensing');
  const y = (i / W) | 0;
  let n = 0;
  for (let x = 0; x < W; x++) { if (cells[y * W + x].s) n++; }
  for (let x = 0; x < W; x++) { const el = els[y * W + x]; el.classList.remove('sense'); void el.offsetWidth; el.classList.add('sense'); setTimeout(() => el.classList.remove('sense'), 2900); }
  cd.sense = Date.now() + ABIL[1].cd * 1000;
  sfx.light(); haptic('ok');
  toast(`Строка ${y + 1}: ${n} ${plural(n, 'слайм', 'слайма', 'слаймов')}`, 3500); updateAbil();
}
$('#btnBack').onclick = goBack;
$('#btnGameDiary').onclick = () => openDiary('game');

/* =====================================================
   ДНЕВНИК
   ===================================================== */
function openDiary(from) {
  diaryFrom = from;
  if (from !== 'game') setTheme('morning');
  show('diary');
  setScene(from === 'game' ? L.theme : 'morning', innerHeight * .9, 0, .5);
  const list = $('#dlist');
  const m = save.mistakes;
  const next = ABIL.find(a => a.need > m);
  let html = '';
  if (save.finished) {
    html += `<div class="finale"><h3>Как новичок стал сапёром</h3>
      <p>Осень кончилась, слаймы ушли в лес.</p>
      <p>Рин приехал новичком, а уезжает с дневником на ${save.pages.length} ${plural(save.pages.length, 'страницу', 'страницы', 'страниц')}. ${m ? `${m} ${plural(m, 'ошибка', 'ошибки', 'ошибок')} — и каждая чему-то научила.` : 'Ни одной ошибки. Подозрительно.'}</p>
      <q>Ошибки — часть пути к тому, чтобы стать сильнее.</q></div>`;
  }
  html += `<div class="prog"><b>Страниц-ошибок: ${m}</b>
    ${ABIL.map(a => `<div class="row ${m >= a.need ? '' : 'off'}"><i style="background-image:var(--spr-${a.spr})"></i>${a.need} стр. — ${a.desc}</div>`).join('')}
    ${next ? `<div class="bar"><div style="width:${Math.min(100, (m % 3) / 3 * 100)}%"></div></div>
      <div style="font-weight:800;font-size:13px;margin-top:6px">До «${next.name}»: ещё ${next.need - m} ${plural(next.need - m, 'страница', 'страницы', 'страниц')}</div>`
      : '<div style="font-weight:800;margin-top:6px">Все способности открыты!</div>'}</div>`;
  if (!save.pages.length) html += `<div class="dempty">Пока пусто.<br>Ошибись — и тут появится первая страница. Серьёзно, это нормально.</div>`;
  else html += save.pages.slice().reverse().map(p => pageHTML(p, null, true)).join('');
  list.innerHTML = html; list.scrollTop = 0;
}
$('#btnDiaryBack').onclick = goBack;
$('#btnReset').onclick = async () => {
  const v = await modal(`<div class="mhead">Стереть дневник?</div><div class="mtext">Пропадут все страницы, способности, рекорды и открытые уровни.</div>`,
    [{text:'Отмена', v:0, cls:'alt'}, {text:'Стереть', v:1}]);
  if (v) { const muted = save.muted; save = defSave(); save.muted = muted; save.seenHelp = true; persist(); openDiary('menu'); toast('Дневник чистый'); }
};

async function renderTrack(i, secs) {
  const oac = new OfflineAudioContext(2, Math.floor(44100 * secs), 44100);
  const tr = TRACKS[i], g = oac.createGain(); g.gain.value = tr.gain || .5; g.connect(oac.destination);
  const e = makeEngine(oac, g);
  e.setBpm(tr.bpm); e.vinyl(!!tr.vinyl);
  let t = .05, step = 0, loop = 0;
  while (t < secs - .3) { e.schedule(tr, step, t, loop); const sd = 60 / tr.bpm / 4; t += tr.swing ? sd * (step % 2 ? 1 - tr.swing : 1 + tr.swing) : sd; step = (step + 1) % 64; if (!step) loop++; }
  const buf = await oac.startRendering(), d = buf.getChannelData(0);
  let pk = 0, ss = 0, nan = false; for (let k = 0; k < d.length; k++) { const v = Math.abs(d[k]); if (v !== v) nan = true; if (v > pk) pk = v; ss += d[k] * d[k]; }
  return {peak: +pk.toFixed(3), rms: +Math.sqrt(ss / d.length).toFixed(4), nan};
}
if (/[?&]debug/.test(location.search)) window.__dbg = {get cells() { return cells; }, get W() { return W; }, scene: setScene, spr: SPR, face: FACE, renderTrack, Music};
$('#menuRadio').innerHTML = radioHTML(true);
openMenu();
radioUI();
Music.loadSaved();
})();
</script>
